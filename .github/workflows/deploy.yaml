name: 'Deploy to VPS'
on:
  push:
    tags:
      - '*.*.*'
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GITHUB_REF_NAME
          script: |
            cd ~/paywise-backend-service
            cp variables.env /tmp/variables.env.backup
            git fetch --tags
            git checkout $GITHUB_REF_NAME
            git pull origin main
            cp /tmp/variables.env.backup variables.env
            docker build --no-cache -t paywise-backend:$GITHUB_REF_NAME .
            docker tag paywise-backend:$GITHUB_REF_NAME paywise-backend:latest
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T paywise-backend alembic upgrade head
            docker images | grep paywise-backend | grep -v latest | grep -v $GITHUB_REF_NAME | awk '{print $3}' | xargs -r docker rmi
            docker image prune -f
            docker builder prune -f
            echo "Deployed $GITHUB_REF_NAME successfully"

services:
  paywise-backend:
    image: paywise-backend:latest
    container_name: paywise-backend
    env_file:
      - variables.env
    environment:
      - PYTHONPATH=/app
    command: python manage.py server
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    container_name: paywise-postgres
    env_file:
      - variables.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: paywise-redis
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  paywise-scheduler:
    image: paywise-backend:latest
    container_name: paywise-scheduler
    env_file:
      - variables.env
    environment:
      - PYTHONPATH=/app
    command: python manage.py scheduler
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  postgres_data:
